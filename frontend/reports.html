<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinWise | Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gradient-bg" data-page="reports">
  <nav class="navbar navbar-dark shadow-sm">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <a class="navbar-brand mb-0" href="index.html"><span class="brand-mark small-mark">FW</span> FinWise</a>
      <div class="nav-links d-flex gap-2 flex-wrap">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="transactions.html" class="nav-link">Transactions</a>
        <a href="loans.html" class="nav-link">Loans</a>
      </div>
    </div>
  </nav>

  <div class="container text-light pb-5">
    <header class="page-intro">
      <p class="eyebrow">REPORTS</p>
      <h1>Financial summaries</h1>
      <p>Review monthly trends, category spending, and export your records.</p>
    </header>

    <div class="card glass p-4 mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label for="report-month">Month</label>
          <input id="report-month" class="form-control" type="number" min="1" max="12">
        </div>
        <div class="col-md-4">
          <label for="report-year">Year</label>
          <input id="report-year" class="form-control" type="number" min="2024">
        </div>
        <div class="col-md-4 d-flex gap-2 align-items-end">
          <button type="button" id="report-load" class="btn btn-main">Refresh</button>
          <button type="button" id="report-export" class="btn btn-outline-light">Export CSV</button>
          <button type="button" id="report-print" class="btn btn-outline-light">Print</button>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-3"><div class="card glass p-3"><p class="metric-label">Income</p><h3 id="report-income">₹0</h3></div></div>
      <div class="col-md-3"><div class="card glass p-3"><p class="metric-label">Expenses</p><h3 id="report-expenses">₹0</h3></div></div>
      <div class="col-md-3"><div class="card glass p-3"><p class="metric-label">Net flow</p><h3 id="report-flow">₹0</h3></div></div>
      <div class="col-md-3"><div class="card glass p-3"><p class="metric-label">Savings rate</p><h3 id="report-rate">0%</h3></div></div>
    </div>

    <div class="card glass p-4">
      <div class="section-heading mb-3">
        <div>
          <p class="eyebrow">DETAILS</p>
          <h2>Filtered transaction list</h2>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-dark table-striped table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Category</th>
              <th>Description</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody id="report-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
