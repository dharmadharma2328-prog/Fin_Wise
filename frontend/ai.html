<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinWise | Money guide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gradient-bg" data-page="ai">
  <nav class="navbar navbar-dark shadow-sm">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <a class="navbar-brand mb-0" href="index.html"><span class="brand-mark small-mark">FW</span> FinWise</a>
      <div class="nav-links d-flex gap-2 flex-wrap">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reports.html" class="nav-link">Reports</a>
        <a href="loans.html" class="nav-link">Loans</a>
      </div>
    </div>
  </nav>

  <div class="container text-light pb-5">
    <header class="page-intro">
      <p class="eyebrow">MONEY GUIDE</p>
      <h1>Review your money habits</h1>
      <p>This local demo summarizes your saved figures and uses preset guidance. It does not send your financial data to an AI service.</p>
    </header>

    <div class="card glass p-4 mb-4">
      <div id="ai-chat" class="chat-box"></div>
      <form id="ai-form" class="mt-3">
        <div class="d-flex gap-2 flex-wrap">
          <input id="ai-question" class="form-control" aria-label="Ask about your finances" placeholder="How am I doing on spending this month?" required>
          <button type="submit" class="btn btn-main">Ask</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
