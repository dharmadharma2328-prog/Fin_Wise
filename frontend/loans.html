<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinWise | Loans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gradient-bg" data-page="loans">
  <nav class="navbar navbar-dark shadow-sm">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <a class="navbar-brand mb-0" href="index.html"><span class="brand-mark small-mark">FW</span> FinWise</a>
      <div class="nav-links d-flex gap-2 flex-wrap">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reports.html" class="nav-link">Reports</a>
        <a href="ai.html" class="nav-link">AI</a>
      </div>
    </div>
  </nav>

  <div class="container text-light pb-5">
    <header class="page-intro">
      <p class="eyebrow">LOANS</p>
      <h1>EMI and repayment planner</h1>
      <p>Estimate monthly repayments, interest totals, and prepayment impact.</p>
    </header>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card glass p-4">
          <form id="loan-form">
            <div class="mb-3">
              <label for="loan-principal">Principal</label>
              <input id="loan-principal" class="form-control" type="number" min="0" step="0.01" value="500000" required>
            </div>
            <div class="mb-3">
              <label for="loan-rate">Annual interest rate (%)</label>
              <input id="loan-rate" class="form-control" type="number" min="0" step="0.01" value="8.5" required>
            </div>
            <div class="mb-3">
              <label for="loan-months">Loan term (months)</label>
              <input id="loan-months" class="form-control" type="number" min="1" value="60" required>
            </div>
            <div class="mb-3">
              <label for="loan-extra">Extra monthly payment</label>
              <input id="loan-extra" class="form-control" type="number" min="0" step="0.01" value="0">
            </div>
            <button type="submit" class="btn btn-main w-100">Calculate</button>
          </form>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card glass p-4">
          <div class="row g-3">
            <div class="col-md-4"><div class="mini-stat"><p class="metric-label">EMI</p><h3 id="loan-emi">₹0</h3></div></div>
            <div class="col-md-4"><div class="mini-stat"><p class="metric-label">Total repayment</p><h3 id="loan-total">₹0</h3></div></div>
            <div class="col-md-4"><div class="mini-stat"><p class="metric-label">Interest</p><h3 id="loan-interest">₹0</h3></div></div>
          </div>
          <div class="mt-4">
            <p id="loan-summary" class="text-muted"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
