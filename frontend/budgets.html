<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinWise | Budgets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gradient-bg" data-page="budgets">
  <nav class="navbar navbar-dark shadow-sm">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <a class="navbar-brand mb-0" href="index.html"><span class="brand-mark small-mark">FW</span> FinWise</a>
      <div class="nav-links d-flex gap-2 flex-wrap">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="transactions.html" class="nav-link">Transactions</a>
        <a href="goals.html" class="nav-link">Goals</a>
      </div>
    </div>
  </nav>

  <div class="container text-light pb-5">
    <header class="page-intro">
      <p class="eyebrow">BUDGETS</p>
      <h1>Monthly category limits</h1>
      <p>Set spending caps and monitor how close each category is to the limit.</p>
    </header>

    <div class="card glass p-4 mb-4">
      <form id="budget-form">
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label for="budget-category">Category</label>
            <input id="budget-category" class="form-control" placeholder="Food, Rent, Travel" required>
          </div>
          <div class="col-md-3">
            <label for="budget-month">Month</label>
            <input id="budget-month" class="form-control" type="number" min="1" max="12" required>
          </div>
          <div class="col-md-3">
            <label for="budget-year">Year</label>
            <input id="budget-year" class="form-control" type="number" min="2024" required>
          </div>
          <div class="col-md-3">
            <label for="budget-limit">Limit</label>
            <input id="budget-limit" class="form-control" type="number" min="0" step="0.01" required>
          </div>
        </div>
        <div class="mt-3 d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-main">Save budget</button>
          <button type="button" id="reset-budget-form" class="btn btn-outline-light">Reset</button>
        </div>
      </form>
    </div>

    <div class="card glass p-4">
      <div class="section-heading mb-3">
        <div>
          <p class="eyebrow">OVERVIEW</p>
          <h2>Budget status</h2>
        </div>
      </div>
      <div id="budget-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
