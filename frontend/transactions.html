<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinWise | Transactions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gradient-bg" data-page="transactions">
  <nav class="navbar navbar-dark shadow-sm">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <a class="navbar-brand mb-0" href="index.html"><span class="brand-mark small-mark">FW</span> FinWise</a>
      <div class="nav-links d-flex gap-2 flex-wrap">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="budgets.html" class="nav-link">Budgets</a>
        <a href="goals.html" class="nav-link">Goals</a>
        <a href="reports.html" class="nav-link">Reports</a>
      </div>
    </div>
  </nav>

  <div class="container text-light pb-5">
    <header class="page-intro">
      <p class="eyebrow">TRANSACTIONS</p>
      <h1>Income and expense history</h1>
      <p>Track every rupee with dates, categories, and notes.</p>
    </header>

    <div class="card glass p-4 mb-4">
      <form id="transaction-form">
        <div class="row g-3">
          <div class="col-md-3">
            <label for="tx-type">Type</label>
            <select id="tx-type" class="form-control">
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="tx-amount">Amount</label>
            <input id="tx-amount" class="form-control" type="number" min="0" step="0.01" required>
          </div>
          <div class="col-md-3">
            <label for="tx-category">Category</label>
            <input id="tx-category" class="form-control" placeholder="Food, rent, salary..." required>
          </div>
          <div class="col-md-3">
            <label for="tx-date">Date</label>
            <input id="tx-date" class="form-control" type="date" required>
          </div>
          <div class="col-md-5">
            <label for="tx-description">Description</label>
            <input id="tx-description" class="form-control" placeholder="Groceries, salary payment...">
          </div>
          <div class="col-md-3">
            <label for="tx-method">Payment method</label>
            <select id="tx-method" class="form-control">
              <option value="Cash">Cash</option>
              <option value="Bank transfer">Bank transfer</option>
              <option value="Card">Card</option>
              <option value="UPI">UPI</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="tx-notes">Notes</label>
            <input id="tx-notes" class="form-control" placeholder="Optional details">
          </div>
        </div>
        <div class="mt-3 d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-main">Save transaction</button>
          <button type="button" id="reset-transaction-form" class="btn btn-outline-light">Reset</button>
        </div>
      </form>
    </div>

    <div class="card glass p-4">
      <div class="section-heading mb-3">
        <div>
          <p class="eyebrow">LIST</p>
          <h2>Recent transactions</h2>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-dark table-striped table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Category</th>
              <th>Description</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="transactions-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
