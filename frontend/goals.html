<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinWise | Goals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gradient-bg" data-page="goals">
  <nav class="navbar navbar-dark shadow-sm">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <a class="navbar-brand mb-0" href="index.html"><span class="brand-mark small-mark">FW</span> FinWise</a>
      <div class="nav-links d-flex gap-2 flex-wrap">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="budgets.html" class="nav-link">Budgets</a>
        <a href="bills.html" class="nav-link">Bills</a>
      </div>
    </div>
  </nav>

  <div class="container text-light pb-5">
    <header class="page-intro">
      <p class="eyebrow">GOALS</p>
      <h1>Plan your milestones</h1>
      <p>Set the target, track your progress, and estimate monthly savings needed.</p>
    </header>

    <div class="card glass p-4 mb-4">
      <form id="goal-form">
        <div class="row g-3">
          <div class="col-md-3">
            <label for="goal-name-input">Goal name</label>
            <input id="goal-name-input" class="form-control" placeholder="Emergency fund" required>
          </div>
          <div class="col-md-3">
            <label for="goal-target">Target amount</label>
            <input id="goal-target" class="form-control" type="number" min="0" step="0.01" required>
          </div>
          <div class="col-md-3">
            <label for="goal-current">Current saved</label>
            <input id="goal-current" class="form-control" type="number" min="0" step="0.01" required>
          </div>
          <div class="col-md-3">
            <label for="goal-date">Target date</label>
            <input id="goal-date" class="form-control" type="date" required>
          </div>
        </div>
        <div class="mt-3 d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-main">Save goal</button>
          <button type="button" id="reset-goal-form" class="btn btn-outline-light">Reset</button>
        </div>
      </form>
    </div>

    <div class="card glass p-4">
      <div class="section-heading mb-3">
        <div>
          <p class="eyebrow">TRACKING</p>
          <h2>Current goals</h2>
        </div>
      </div>
      <div id="goal-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
