<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinWise | Bills</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gradient-bg" data-page="bills">
  <nav class="navbar navbar-dark shadow-sm">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <a class="navbar-brand mb-0" href="index.html"><span class="brand-mark small-mark">FW</span> FinWise</a>
      <div class="nav-links d-flex gap-2 flex-wrap">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="transactions.html" class="nav-link">Transactions</a>
        <a href="goals.html" class="nav-link">Goals</a>
      </div>
    </div>
  </nav>

  <div class="container text-light pb-5">
    <header class="page-intro">
      <p class="eyebrow">BILLS</p>
      <h1>Recurring payments</h1>
      <p>Stay ahead of due dates, track payment history, and catch overdue items early.</p>
    </header>

    <div class="card glass p-4 mb-4">
      <form id="bill-form">
        <div class="row g-3">
          <div class="col-md-3">
            <label for="bill-name">Bill name</label>
            <input id="bill-name" class="form-control" placeholder="Rent, Internet" required>
          </div>
          <div class="col-md-3">
            <label for="bill-amount">Amount</label>
            <input id="bill-amount" class="form-control" type="text" inputmode="decimal" data-money-input autocomplete="off" required>
          </div>
          <div class="col-md-3">
            <label for="bill-date">Due date</label>
            <input id="bill-date" class="form-control" type="date" required>
          </div>
          <div class="col-md-3">
            <label for="bill-recurrence">Recurrence</label>
            <select id="bill-recurrence" class="form-control">
              <option value="one-time">One-time</option>
              <option value="weekly">Weekly</option>
              <option value="monthly" selected>Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>
        </div>
        <div class="mt-3 d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-main">Save bill</button>
          <button type="button" id="reset-bill-form" class="btn btn-outline-light">Reset</button>
        </div>
      </form>
    </div>

    <div class="card glass p-4">
      <div class="section-heading mb-3">
        <div>
          <p class="eyebrow">SCHEDULE</p>
          <h2>Due bills</h2>
        </div>
      </div>
      <div id="bill-list"></div>
    </div>

    <div class="card glass p-4 mt-4">
      <div class="section-heading mb-3">
        <div>
          <p class="eyebrow">HISTORY</p>
          <h2>Payments recorded</h2>
        </div>
      </div>
      <div id="bill-payment-history"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
